<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 860" role="img" aria-label="whoami and accolades">
  <rect width="1600" height="860" rx="14" fill="#1f1f1f" stroke="#2d2d2d" stroke-width="1"/>

  <text x="1568" y="64" font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="22" fill="#586069" text-anchor="end">— zsh</text>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">

    <!-- whoami prompt -->
    <g font-size="32" font-weight="600">
      <text x="36" y="68" fill="#79C0FF">~</text>
      <text x="56" y="68" fill="#d1d5db">$</text>
      <text x="88" y="68" fill="#E5C07B">whoami</text>
    </g>

    <!-- philosophical bio -->
    <g font-size="28" fill="#d1d5db">
      <text x="36" y="148">I'd rather be <tspan fill="#7EE787" font-weight="600">curious</tspan> than right. Most of what I believe today I'll probably revise</text>
      <text x="36" y="192">tomorrow, and I think that's the point. The version of me I keep trying to build isn't</text>
      <text x="36" y="236">sure of much, just <tspan fill="#79C0FF" font-weight="600">patient</tspan> enough to keep looking, and <tspan fill="#E5C07B" font-weight="600">stubborn</tspan> enough to not look away.</text>
    </g>

    <!-- divider -->
    <line x1="36" y1="296" x2="1564" y2="296" stroke="#2d2d2d" stroke-width="1"/>

    <!-- cat accolades.log prompt -->
    <g font-size="32" font-weight="600">
      <text x="36" y="356" fill="#79C0FF">~</text>
      <text x="56" y="356" fill="#d1d5db">$</text>
      <text x="88" y="356" fill="#E5C07B">cat</text>
      <text x="148" y="356" fill="#d1d5db">accolades.log</text>
    </g>

    <!-- Entry 1 -->
    <rect x="36" y="420" width="4" height="80" fill="#FFB454"/>
    <g font-size="26">
      <text x="60" y="448" fill="#FFB454" font-weight="700">[01]</text>
      <text x="160" y="448" fill="#E5C07B" font-weight="600">Pragyaan CTF</text>
      <text x="540" y="448" fill="#586069">—</text>
      <text x="570" y="448" fill="#d1d5db" font-weight="600">2nd Nationally.</text>
      <text x="160" y="488" fill="#8b949e">Runner-up at India's national cybersecurity CTF challenge.</text>
    </g>

    <!-- Entry 2 -->
    <rect x="36" y="532" width="4" height="80" fill="#9EDF7F"/>
    <g font-size="26">
      <text x="60" y="560" fill="#9EDF7F" font-weight="700">[02]</text>
      <text x="160" y="560" fill="#E5C07B" font-weight="600">Codevincii CTF</text>
      <text x="540" y="560" fill="#586069">—</text>
      <text x="570" y="560" fill="#d1d5db" font-weight="600">6th Internationally.</text>
      <text x="160" y="600" fill="#8b949e">Top 10 finish at an international cybersecurity capture-the-flag competition.</text>
    </g>

    <!-- Entry 3 -->
    <rect x="36" y="644" width="4" height="80" fill="#79C0FF"/>
    <g font-size="26">
      <text x="60" y="672" fill="#79C0FF" font-weight="700">[03]</text>
      <text x="160" y="672" fill="#E5C07B" font-weight="600">SNUC Hacks</text>
      <text x="540" y="672" fill="#586069">—</text>
      <text x="570" y="672" fill="#d1d5db" font-weight="600">Runner-up.</text>
      <text x="160" y="712" fill="#8b949e">Second place at the Shiv Nadar University inter-college hackathon.</text>
    </g>

    <!-- Entry 4 -->
    <rect x="36" y="756" width="4" height="80" fill="#FF7B72"/>
    <g font-size="26">
      <text x="60" y="784" fill="#FF7B72" font-weight="700">[04]</text>
      <text x="160" y="784" fill="#E5C07B" font-weight="600">HP CodeWars</text>
      <text x="540" y="784" fill="#586069">—</text>
      <text x="570" y="784" fill="#d1d5db" font-weight="600">27th All-India.</text>
      <text x="160" y="824" fill="#8b949e">Ranked 27th nationally in the All-India enterprise coding challenge.</text>
    </g>
  </g>
</svg>
