<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 280" role="img" aria-label="download resume">
  <rect width="1600" height="280" rx="14" fill="#1f1f1f" stroke="#2d2d2d" stroke-width="1"/>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <g font-size="32" font-weight="600">
      <text x="36" y="68" fill="#79C0FF">~</text>
      <text x="56" y="68" fill="#d1d5db">$</text>
      <text x="88" y="68" fill="#E5C07B">curl</text>
      <text x="172" y="68" fill="#7EE787">-O</text>
      <text x="222" y="68" fill="#d1d5db">resume.pdf</text>
    </g>
    <text x="1568" y="64" font-size="22" fill="#586069" text-anchor="end">— zsh</text>

    <g font-size="24">
      <text x="36" y="140" fill="#586069">[</text>
      <rect x="56" y="120" width="1100" height="24" fill="#7EE787" rx="2"/>
      <text x="1170" y="140" fill="#586069">]</text>
      <text x="1196" y="140" fill="#7EE787" font-weight="700">100%</text>
      <text x="1284" y="140" fill="#586069">·</text>
      <text x="1308" y="140" fill="#8b949e">142 KB</text>
      <text x="1408" y="140" fill="#586069">·</text>
      <text x="1432" y="140" fill="#8b949e">2 pages</text>
    </g>

    <g font-size="26">
      <text x="36" y="200" fill="#7EE787" font-weight="700">✓</text>
      <text x="68" y="200" fill="#d1d5db">saved</text>
      <text x="160" y="200" fill="#586069">→</text>
      <text x="200" y="200" fill="#79C0FF" font-weight="600" text-decoration="underline">resume.pdf</text>
      <text x="420" y="200" fill="#586069">·</text>
      <text x="444" y="200" font-size="22" fill="#586069">click anywhere to download</text>
    </g>
  </g>
</svg>
