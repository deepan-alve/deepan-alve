<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" fill="none">
  <!-- Background -->
  <rect width="800" height="360" rx="24" fill="#0A0A0B"/>
  
  <defs>
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="hex_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D1FF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Hexagon Path Helper (Side: 70) -->
  <g transform="translate(180, 80)">
    <!-- Hex 1: CTF -->
    <path d="M70 0 L130.6 35 L130.6 105 L70 140 L9.4 105 L9.4 35 Z" fill="url(#hex_grad)" stroke="#00D1FF" stroke-width="2" filter="url(#neon_glow)"/>
    <text x="70" y="65" text-anchor="middle" fill="#00D1FF" font-family="monospace" font-size="24" font-weight="bold">🚩</text>
    <text x="70" y="95" text-anchor="middle" fill="#F0F6FC" font-family="sans-serif" font-size="14" font-weight="bold">CTF</text>
    <text x="70" y="112" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">WINNER</text>
  </g>

  <g transform="translate(310, 155)">
    <!-- Hex 2: HTB -->
    <path d="M70 0 L130.6 35 L130.6 105 L70 140 L9.4 105 L9.4 35 Z" fill="url(#hex_grad)" stroke="#00D1FF" stroke-width="2" filter="url(#neon_glow)"/>
    <text x="70" y="65" text-anchor="middle" fill="#00D1FF" font-family="monospace" font-size="24" font-weight="bold">🛡️</text>
    <text x="70" y="95" text-anchor="middle" fill="#F0F6FC" font-family="sans-serif" font-size="14" font-weight="bold">HTB</text>
    <text x="70" y="112" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">TOP 750</text>
  </g>

  <g transform="translate(310, 5)">
    <!-- Hex 3: ICPC -->
    <path d="M70 0 L130.6 35 L130.6 105 L70 140 L9.4 105 L9.4 35 Z" fill="url(#hex_grad)" stroke="#00D1FF" stroke-width="2" filter="url(#neon_glow)"/>
    <text x="70" y="65" text-anchor="middle" fill="#00D1FF" font-family="monospace" font-size="24" font-weight="bold">💻</text>
    <text x="70" y="95" text-anchor="middle" fill="#F0F6FC" font-family="sans-serif" font-size="14" font-weight="bold">ICPC</text>
    <text x="70" y="112" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">REGIONAL</text>
  </g>

  <g transform="translate(440, 80)">
    <!-- Hex 4: CodeWars -->
    <path d="M70 0 L130.6 35 L130.6 105 L70 140 L9.4 105 L9.4 35 Z" fill="url(#hex_grad)" stroke="#00D1FF" stroke-width="2" filter="url(#neon_glow)"/>
    <text x="70" y="65" text-anchor="middle" fill="#00D1FF" font-family="monospace" font-size="24" font-weight="bold">🚀</text>
    <text x="70" y="95" text-anchor="middle" fill="#F0F6FC" font-family="sans-serif" font-size="14" font-weight="bold">CODEWARS</text>
    <text x="70" y="112" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">TOP 30</text>
  </g>
  
  <!-- Decorative Elements -->
  <line x1="250" y1="150" x2="319" y2="190" stroke="#00D1FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="250" y1="150" x2="319" y2="40" stroke="#00D1FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="510" y1="150" x2="441" y2="190" stroke="#00D1FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
</svg>
