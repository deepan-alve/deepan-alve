<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 96" role="img" aria-label="whoami section heading">
  <rect width="1600" height="96" rx="14" fill="#1f1f1f" stroke="#2d2d2d" stroke-width="1"/>

  <!-- macOS-style window dots -->
  <circle cx="32" cy="48" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="48" r="7" fill="#febc2e"/>
  <circle cx="80" cy="48" r="7" fill="#28c840"/>

  <!-- divider -->
  <line x1="112" y1="20" x2="112" y2="76" stroke="#2d2d2d" stroke-width="1"/>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="32" font-weight="600">
    <text x="140" y="60" fill="#7EE787">deepan@workspace</text>
    <text x="432" y="60" fill="#d1d5db">:</text>
    <text x="446" y="60" fill="#79C0FF">~</text>
    <text x="466" y="60" fill="#d1d5db">$</text>
    <text x="498" y="60" fill="#E5C07B">whoami</text>
    <rect x="618" y="34" width="3" height="34" fill="#7EE787">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right-side meta -->
  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="22" fill="#586069">
    <text x="1568" y="56" text-anchor="end">— bash</text>
  </g>
</svg>
